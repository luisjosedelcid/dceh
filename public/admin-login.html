<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DCE — Sign in</title>
<style>
  :root{
    --navy:#1B2642; --gold:#B88B47; --cream:#F5F1E8;
    --border:rgba(245,241,232,0.2); --red:#e07385; --gray:rgba(245,241,232,0.65);
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    font-family:Calibri,-apple-system,sans-serif;
    background:var(--navy); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    padding:32px 24px; padding-top:max(32px,env(safe-area-inset-top));
  }
  .card{max-width:380px; width:100%}
  .brand{
    font-family:Georgia,serif; font-size:28px; letter-spacing:-0.01em;
    color:var(--gold); margin:0 0 4px; text-align:center;
  }
  .tagline{font-size:12.5px; color:var(--gray); letter-spacing:0.05em; text-transform:uppercase; margin:0 0 40px; text-align:center}
  label{display:block; font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--gray); margin:16px 0 6px}
  input{
    width:100%; padding:14px 16px; border:1px solid var(--border); border-radius:12px;
    background:transparent; color:var(--cream); font-size:16px; font-family:inherit;
    -webkit-appearance:none;
  }
  input:focus{outline:none; border-color:var(--gold)}
  input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--navy) inset; -webkit-text-fill-color:var(--cream)}
  .btn{
    display:block; width:100%; padding:16px; border:none; border-radius:12px;
    background:var(--gold); color:var(--navy); font-size:16px; font-weight:700;
    letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;
    margin-top:20px; font-family:inherit;
  }
  .btn:disabled{opacity:0.4; cursor:not-allowed}
  .status{font-size:13px; color:var(--gray); min-height:20px; margin-top:14px; text-align:center}
  .status.err{color:var(--red)}
  .foot{font-size:12px; color:var(--gray); text-align:center; margin-top:24px}
  .foot a{color:var(--gold); text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1 class="brand">DCE Holdings</h1>
  <p class="tagline">Family office · Investment platform</p>

  <form id="form" autocomplete="on">
    <label>Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" class="btn" id="btn-submit">Sign in</button>
    <div class="status" id="status"></div>
  </form>

  <p class="foot">After signing in, <a href="/enroll.html">enroll Face ID and PIN</a> so you can skip passwords next time.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const setStatus = (t, err) => { $('status').className = 'status' + (err?' err':''); $('status').textContent = t || ''; };
const params = new URLSearchParams(location.search);
const returnTo = params.get('return') || '/enroll.html';

// Prefill saved email
const savedEmail = localStorage.getItem('dce_admin_email');
if (savedEmail) $('email').value = savedEmail;

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim().toLowerCase();
  const password = $('password').value;
  if (!email || !password) { setStatus('Fill both fields', true); return; }
  const btn = $('btn-submit');
  btn.disabled = true;
  setStatus('Signing in...');
  try {
    const r = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    localStorage.setItem('dce_admin_token', j.token);
    localStorage.setItem('dce_admin_token_exp', String(j.expiresAt || ''));
    localStorage.setItem('dce_admin_email', email);
    if (j.user) {
      localStorage.setItem('dce_admin_user', JSON.stringify(j.user));
      if (j.user.displayName) localStorage.setItem('dce_admin_display_name', j.user.displayName);
      if (j.user.role) localStorage.setItem('dce_admin_role', j.user.role);
    }
    // Mark session as unlocked so the auth gate doesn't bounce us back
    sessionStorage.setItem('dce_auth_ok', '1');
    setStatus('Signed in — redirecting...');
    location.href = returnTo;
  } catch (err) {
    setStatus(err.message || 'Sign-in failed', true);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
