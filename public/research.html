<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCE Holdings — Workflow</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1b2642;--gold:#b88b47;--gold-lt:#d4aa6a;--gold-dim:rgba(184,139,71,0.10);--gold-rule:rgba(184,139,71,0.30);
    --cream:#f5f1eb;--white:#ffffff;--ink:#1b2642;--gray-mid:#8a9098;--gray-txt:#606060;
    --green:#2a7a56;--red:#9b2335;--amber:#b8860b;--rule:rgba(27,38,66,0.09);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:'Archivo','Helvetica Neue',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}

  header{background:var(--navy);border-bottom:2px solid var(--gold);padding:0 48px;display:flex;align-items:center;min-height:64px;justify-content:space-between}
  .logo{font-size:20px;font-weight:700;color:var(--white)}.logo span{color:var(--gold);font-weight:300}
  .hnav{display:flex;gap:8px;align-items:center}
  .hnav a{font-size:10px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;padding:8px 16px;color:rgba(255,255,255,0.5);text-decoration:none;border:1px solid transparent;transition:all .2s}
  .hnav a:hover{color:var(--gold);border-color:var(--gold-rule)}
  .hnav a.active{color:var(--gold);border-color:var(--gold)}

  main{padding:28px 36px 60px}
  .slbl{font-size:9px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .slbl::before{content:'';width:24px;height:1px;background:var(--gold)}
  h1{font-size:34px;font-weight:300;letter-spacing:-0.02em;margin-bottom:6px}
  .subtitle{color:var(--gray-txt);font-size:13px;margin-bottom:24px;max-width:760px}

  .gate{max-width:520px;margin:80px auto;padding:48px 40px;background:var(--white);border:1px solid var(--rule);text-align:center}
  .gate h2{font-size:22px;font-weight:400;margin-bottom:8px}
  .gate p{color:var(--gray-txt);font-size:13px;margin-bottom:24px;line-height:1.6}
  .gate .gh-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;background:var(--navy);color:var(--white);border:none;font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:all .2s}
  .gate .gh-btn:hover{background:#0d1428}

  /* PRE-FILL BANNER (when coming from Idea Feed) */
  .prefill-banner{background:var(--gold-dim);border:1px solid var(--gold-rule);border-left:3px solid var(--gold);padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink)}
  .prefill-banner strong{color:var(--gold);letter-spacing:0.05em}
  .prefill-banner .pf-close{background:none;border:none;color:var(--gray-mid);font-size:18px;cursor:pointer;line-height:1}
  .prefill-banner .pf-close:hover{color:var(--ink)}

  /* ADD ROW */
  .add-row{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;margin-bottom:18px;background:var(--white);padding:10px;border:1px solid var(--rule)}
  @media (max-width:820px){
    .add-row{grid-template-columns:90px 1fr 72px;gap:8px;padding:8px}
    .add-row .add-inp{padding:9px 10px;font-size:12px}
    .add-row .add-btn{padding:9px 6px;font-size:10px;letter-spacing:0.1em}
  }
  .add-inp{padding:10px 12px;border:1px solid var(--rule);font-family:inherit;font-size:13px;background:var(--cream);outline:none;width:100%}
  .add-inp:focus{border-color:var(--gold);background:var(--white)}
  .add-inp.ticker{font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
  .add-btn{padding:10px;background:var(--navy);color:var(--white);border:none;font-family:inherit;font-size:11px;letter-spacing:0.15em;font-weight:500;text-transform:uppercase;cursor:pointer;transition:.2s}
  .add-btn:hover{background:#0d1428}
  .add-btn:disabled{opacity:.4;cursor:not-allowed}

  /* TICKER AUTOCOMPLETE */
  .ticker-wrap{position:relative}
  .ticker-suggest{
    position:absolute;left:0;right:0;top:calc(100% + 4px);
    background:var(--white);border:1px solid var(--rule);
    box-shadow:0 6px 20px rgba(27,38,66,0.12);
    z-index:50;max-height:280px;overflow-y:auto;
    display:none;
  }
  .ticker-suggest.open{display:block}
  .ticker-suggest .row{
    padding:10px 12px;cursor:pointer;
    border-bottom:1px solid var(--rule);
    display:flex;align-items:baseline;gap:10px;
  }
  .ticker-suggest .row:last-child{border-bottom:none}
  .ticker-suggest .row:hover,
  .ticker-suggest .row.active{background:var(--cream)}
  .ticker-suggest .sym{
    font-weight:700;font-size:12px;color:var(--navy);
    letter-spacing:0.05em;min-width:70px;
  }
  .ticker-suggest .desc{
    font-size:12px;color:var(--gray-txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .ticker-suggest .empty{padding:12px;font-size:12px;color:var(--gray-mid);text-align:center}
  @media (max-width:820px){
    .ticker-wrap{position:static}
    .ticker-suggest{left:8px;right:8px;top:auto}
    .ticker-suggest .sym{min-width:60px;font-size:11px}
    .ticker-suggest .desc{font-size:11px}
  }

  .stats{display:flex;gap:24px;margin-bottom:18px;font-size:11px;color:var(--gray-txt);letter-spacing:0.05em}
  .stats strong{color:var(--ink);font-weight:600;margin-right:4px}

  /* KANBAN */
  .kanban{display:grid;grid-template-columns:repeat(7,minmax(200px,1fr));gap:12px}
  @media (max-width:1400px){.kanban{display:flex;overflow-x:auto;padding-bottom:8px}.kanban>.col{min-width:240px;flex:0 0 240px}}

  /* MOBILE: one column per page with scroll-snap + pagination dots */
  @media (max-width:820px){
    .kanban{
      display:flex;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scroll-behavior:smooth;
      scrollbar-width:none;
      padding:0 20px 8px;
      margin:0 -20px;
      gap:0;
    }
    .kanban::-webkit-scrollbar{display:none}
    .kanban>.col{
      min-width:calc(100vw - 40px);
      flex:0 0 calc(100vw - 40px);
      scroll-snap-align:center;
      scroll-snap-stop:always;
      margin-right:12px;
    }
    .kanban>.col:last-child{margin-right:0}
    .kanban-pager{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:14px 0 6px;
      user-select:none;
    }
    .kanban-pager .dot{
      width:6px;height:6px;border-radius:50%;
      background:rgba(27,38,66,0.2);
      transition:all .2s;
      cursor:pointer;
    }
    .kanban-pager .dot.active{background:var(--gold);width:20px;border-radius:3px}
    .kanban-pager .label{
      font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
      color:var(--gray-mid);font-weight:600;
      margin-left:14px;min-width:110px;
    }
  }
  @media (min-width:821px){.kanban-pager{display:none}}
  .col.terminal{border-top-color:#9aa0a6}
  .col.terminal-invested{border-top-color:#2f7a3f}
  .col.terminal-followed{border-top-color:#1b2642}
  .col.terminal-passed{border-top-color:#b88b47}
  .col{background:var(--white);border-top:2px solid var(--gold);min-height:300px;display:flex;flex-direction:column}
  .col-h{padding:14px 14px 8px;border-bottom:1px solid var(--rule)}
  .col-h .ttl{font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
  .col-h .cnt{font-size:10px;color:var(--gray-mid);letter-spacing:0.05em}
  .col-body{padding:10px;flex:1;display:flex;flex-direction:column;gap:8px;min-height:80px;transition:background .2s}
  .col-body.drag-over{background:var(--gold-dim)}

  /* CARD */
  .card{background:var(--white);border:1px solid var(--rule);padding:12px;cursor:grab;transition:all .2s;position:relative}
  .card:hover{border-color:var(--gold-rule);box-shadow:0 1px 4px rgba(27,38,66,0.06)}
  .card.dragging{opacity:.4;cursor:grabbing}
  .card-tk{font-size:15px;font-weight:700;letter-spacing:0.03em;color:var(--ink);margin-bottom:1px}
  .card-nm{font-size:11px;color:var(--gray-txt);margin-bottom:8px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .b{font-size:9px;font-weight:600;letter-spacing:0.05em;padding:2px 6px;border-radius:2px}
  .b.q{background:rgba(42,122,86,0.1);color:var(--green)}
  .b.v{background:rgba(184,134,11,0.12);color:var(--amber)}
  .b.irr{background:var(--gold-dim);color:var(--gold)}
  .card-nt{font-size:11px;color:var(--gray-txt);line-height:1.45;margin-bottom:8px;font-style:italic;white-space:pre-wrap;word-break:break-word}
  .card-meta{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--gray-mid);letter-spacing:0.03em;border-top:1px dashed var(--rule);padding-top:6px}
  .card-meta .comments-cnt{display:inline-flex;align-items:center;gap:3px;color:var(--gold);font-weight:500}
  .card-x{position:absolute;top:6px;right:6px;background:none;border:none;cursor:pointer;color:var(--gray-mid);font-size:14px;padding:2px 6px;line-height:1;opacity:0;transition:.2s}
  .card:hover .card-x{opacity:1}
  .card-x:hover{color:var(--red)}
  /* Owner avatar */
  .owner-av{position:absolute;top:8px;right:28px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;letter-spacing:0.02em;border:1.5px solid var(--white);box-shadow:0 0 0 1px var(--rule);cursor:default;user-select:none}
  .owner-av.unassigned{background:transparent;color:var(--gray-mid);border:1.5px dashed var(--rule);box-shadow:none;font-weight:600}
  /* Owner picker in modal */
  .owner-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .owner-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border:1px solid var(--rule);background:var(--white);cursor:pointer;font-size:12px;color:var(--ink);transition:all .15s;font-family:inherit}
  .owner-chip:hover{border-color:var(--gold-rule);background:rgba(184,139,71,0.04)}
  .owner-chip.selected{border-color:var(--gold);background:var(--gold-dim)}
  .owner-chip .av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
  .owner-chip.unassigned .av{background:transparent;color:var(--gray-mid);border:1.5px dashed var(--rule)}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(27,38,66,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--white);max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;border-top:3px solid var(--gold);overflow-y:auto}
  .modal-h{padding:20px 24px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-start}
  .modal-h .tkr{font-size:22px;font-weight:700;letter-spacing:0.02em;margin-bottom:1px}
  .modal-h .nm{font-size:12px;color:var(--gray-txt);margin-bottom:8px}
  .modal-h .badges{margin-bottom:0}
  .modal-h .close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-mid);line-height:1}
  .modal-h .close:hover{color:var(--ink)}

  .modal-section{padding:18px 24px;border-bottom:1px solid var(--rule)}
  .modal-section:last-child{border-bottom:none}
  .modal-section h4{font-size:10px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}

  /* Deliverables slots */
  .deliverables{display:flex;flex-direction:column;gap:8px}
  .slot{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);background:var(--cream);transition:border-color .15s}
  .slot:hover{border-color:var(--gold-rule)}
  .slot-icon{font-size:9px;font-weight:600;letter-spacing:0.08em;flex-shrink:0;min-width:34px;padding:3px 6px;text-align:center;background:var(--cream);border:1px solid var(--gold-rule);color:var(--navy);border-radius:2px}
  .slot-body{flex:1;min-width:0}
  .slot-label{font-size:11px;font-weight:600;color:var(--ink);letter-spacing:0.02em}
  .slot-meta{font-size:10px;color:var(--gray-txt);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot-meta.empty{color:var(--gray-mid);font-style:italic}
  .slot-actions{display:flex;gap:6px;flex-shrink:0}
  .slot-btn{background:var(--white);border:1px solid var(--gold-rule);color:var(--gold);font-family:inherit;font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;padding:6px 10px;cursor:pointer;transition:all .15s}
  .slot-btn:hover{background:var(--gold);color:var(--white);border-color:var(--gold)}
  .slot-btn.danger{color:var(--red);border-color:rgba(155,35,53,0.25)}
  .slot-btn.danger:hover{background:var(--red);color:var(--white);border-color:var(--red)}
  .slot-btn:disabled{opacity:.5;cursor:not-allowed}
  .slot-btn.uploading{background:var(--gold-dim);color:var(--gold);pointer-events:none}
  .slot input[type=file]{display:none}

  /* Generate Dashboard button */
  .gen-btn{background:var(--navy);color:var(--white);border:none;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;padding:10px 18px;cursor:pointer;transition:background .15s}
  .gen-btn:hover:not(:disabled){background:#0d1428}
  .gen-btn:disabled{background:var(--gray-mid);cursor:not-allowed;opacity:.6}
  .gen-btn.busy{background:var(--gold);color:var(--white);cursor:progress;pointer-events:none}

  /* Card badge for uploaded assets count */
  .card-assets{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-weight:500}
  .card-assets.pending{color:var(--gray-mid)}
  .note-edit{width:100%;padding:10px;border:1px solid var(--rule);font-family:inherit;font-size:12px;background:var(--cream);outline:none;resize:vertical;min-height:60px}
  .note-edit:focus{border-color:var(--gold);background:var(--white)}
  .save-note{margin-top:8px;padding:6px 12px;background:var(--navy);color:var(--white);border:none;font-family:inherit;font-size:10px;letter-spacing:0.15em;font-weight:500;text-transform:uppercase;cursor:pointer}
  .save-note:hover{background:#0d1428}
  .save-note.saved{background:var(--green)}

  .comments-list{display:flex;flex-direction:column;gap:14px;max-height:320px;overflow-y:auto;padding-right:4px}
  .comment{display:flex;gap:10px;align-items:flex-start}
  .comment .avatar-circle{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:0.02em}
  .comment-body{flex:1;background:var(--cream);padding:10px 12px;border:1px solid var(--rule);border-radius:2px}
  .comment-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .comment-h .auth{font-size:11px;font-weight:600;color:var(--ink)}
  .comment-h .when{font-size:9px;color:var(--gray-mid);letter-spacing:0.03em}
  .comment-text{font-size:12px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .comment-del{background:none;border:none;color:var(--gray-mid);font-size:10px;cursor:pointer;margin-top:4px;padding:0}
  .comment-del:hover{color:var(--red)}
  .no-comments{font-size:11px;color:var(--gray-mid);font-style:italic;text-align:center;padding:20px 0}

  .comment-form{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
  .comment-form textarea{flex:1;padding:10px;border:1px solid var(--rule);font-family:inherit;font-size:12px;background:var(--cream);outline:none;resize:vertical;min-height:50px;line-height:1.5}
  .comment-form textarea:focus{border-color:var(--gold);background:var(--white)}
  .comment-form button{padding:0 16px;background:var(--gold);color:var(--white);border:none;font-family:inherit;font-size:10px;letter-spacing:0.15em;font-weight:500;text-transform:uppercase;cursor:pointer;align-self:stretch}
  .comment-form button:hover{background:var(--gold-lt)}
  .comment-form button:disabled{opacity:.4;cursor:not-allowed}

  footer{border-top:1px solid var(--rule);padding:24px 48px;display:flex;justify-content:space-between;font-size:10px;color:var(--gray-mid);letter-spacing:0.05em}

  .loading{text-align:center;padding:60px;color:var(--gray-mid);font-size:12px;letter-spacing:0.05em}
</style>

<script>
// ============================================================
// CONFIG
// ============================================================
// Stage taxonomy aligned to Operations Manual v4.4 (section 3.0):
// Backlog → Deep Dive → Adversarial → Committee Review → Invested / Followed / Passed.
// DB stage keys (backlog/analysis/review/decision/…) stay unchanged;
// only display labels are updated so historical rows and stage automations
// keep working without a migration.
const COLUMNS = [
  { id: 'backlog',  title: 'Backlog',          desc: 'Idea Feed — leads awaiting curation' },
  { id: 'analysis', title: 'Deep Dive',        desc: 'Audited base case in progress' },
  { id: 'review',   title: 'Adversarial',      desc: 'Thesis Breaker & probability worksheet' },
  { id: 'decision', title: 'Committee Review', desc: 'Awaiting decision (CIO-led while AUM < USD 10M)' },

function authToken() { return window.dceAuth ? window.dceAuth.token() : null; }
function authUser()  { return window.dceAuth ? window.dceAuth.user()  : null; }

async function api(path, opts = {}) {
  const tk = authToken();
  if (!tk) throw new Error('Not authenticated');
  const headers = Object.assign(
    { 'Content-Type': 'application/json', 'x-admin-token': tk },
    opts.headers || {}
  );
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('application/json') ? await r.json().catch(() => ({})) : {};
  if (!r.ok) {
    const err = new Error(data.error || `HTTP ${r.status}`);
    err.status = r.status; err.payload = data;
    throw err;
  }
  return data;
}

async function boot() {
  // Wait for dce-auth.js (defer) to be ready
  if (!window.dceAuth) {
    setTimeout(boot, 50);
    return;
  }

  // Read pre-fill query string (from Idea Feed)
  const qs = new URLSearchParams(window.location.search);
  if (qs.get('ticker') || qs.get('name')) {
    prefill = {
      ticker: (qs.get('ticker') || '').toUpperCase().slice(0, 8),
      name:   qs.get('name') || '',
      note:   qs.get('note') || '',
    };
  }

  // Auth gate
  if (!window.dceAuth.isAdmin()) {
    renderGate();
    // When user logs in via the global modal, re-boot
    window.dceAuth.onChange((adm) => { if (adm) boot(); });
    return;
  }

  const u = authUser();
  currentUser = {
    username: (u && u.email) || 'admin',
    name:     (u && (u.displayName || u.name)) || (u && u.email) || 'Admin',
  };

  try {
    await loadPipeline();
    renderApp();
    // Hydrate deliverables badges in background (non-blocking)
    preloadAllDeliverables();
  } catch (e) {
    console.error(e);
    document.getElementById('main-content').innerHTML =
      `<div class="loading">Error loading workflow: ${esc(e.message)}</div>`;
  }
}

// ============================================================
// TICKER AUTOCOMPLETE
// ============================================================
// Debounced /api/finnhub-search lookup. Shows up to 5 matches under
// the ticker input; user picks with click, tap, arrows+enter, or tab.
// Selecting a suggestion fills BOTH ticker and name fields.
let _tsDebounce = null;
let _tsAbort   = null;
let _tsItems   = [];
let _tsActive  = -1;
let _tsLastQ   = '';

function setupTickerAutocomplete() {
  const inp = document.getElementById('add-ticker');
  const box = document.getElementById('ticker-suggest');
  const nameInp = document.getElementById('add-name');
  if (!inp || !box) return;

  const close = () => { box.classList.remove('open'); _tsActive = -1; };

  const render = (items) => {
    _tsItems = items;
    _tsActive = -1;
    if (!items.length) {
      box.innerHTML = `<div class="empty">No matches</div>`;
    } else {
      box.innerHTML = items.map((it, i) => `
        <div class="row" data-idx="${i}" role="option">
          <span class="sym">${esc(it.displaySymbol || it.symbol)}</span>
          <span class="desc">${esc(it.description)}</span>
        </div>
      `).join('');
    }
    box.classList.add('open');
  };

  const pick = (idx) => {
    const it = _tsItems[idx];
    if (!it) return;
    inp.value = (it.displaySymbol || it.symbol).toUpperCase();
    if (nameInp && !nameInp.value.trim()) nameInp.value = it.description || '';
    close();
    inp.focus();
  };

  inp.addEventListener('input', () => {
    const q = inp.value.trim();
    // Force uppercase visually (ticker input class already does it, but we
    // also want the value stored uppercase for consistency).
    if (q !== q.toUpperCase()) inp.value = q.toUpperCase();
    const qUp = inp.value.trim();
    if (qUp.length < 1) { close(); return; }
    if (qUp === _tsLastQ) return;
    _tsLastQ = qUp;

    clearTimeout(_tsDebounce);
    _tsDebounce = setTimeout(async () => {
      if (_tsAbort) _tsAbort.abort();
      _tsAbort = new AbortController();
      try {
        const r = await fetch(`/api/finnhub-search?q=${encodeURIComponent(qUp)}`, { signal: _tsAbort.signal });
        if (!r.ok) return;
        const data = await r.json();
        // Only render if the query still matches what's in the input
        if (inp.value.trim().toUpperCase() !== qUp) return;
        render(Array.isArray(data.result) ? data.result : []);
      } catch (e) { /* aborted or network hiccup */ }
    }, 180);
  });

  inp.addEventListener('keydown', (e) => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _tsActive = Math.min(_tsActive + 1, _tsItems.length - 1);
      updateActive();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _tsActive = Math.max(_tsActive - 1, 0);
      updateActive();
    } else if (e.key === 'Enter') {
      if (_tsActive >= 0) { e.preventDefault(); pick(_tsActive); }
    } else if (e.key === 'Escape') {
      close();
    } else if (e.key === 'Tab' && _tsActive >= 0) {
      pick(_tsActive);
    }
  });

  const updateActive = () => {
    box.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('active', i === _tsActive));
    const el = box.querySelector(`.row[data-idx="${_tsActive}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  };

  // Delegated click (also handles touch tap on mobile)
  box.addEventListener('mousedown', (e) => {
    // mousedown fires before blur, keeping the input focused after pick
    const row = e.target.closest('.row');
    if (!row) return;
    e.preventDefault();
    pick(Number(row.dataset.idx));
  });

  inp.addEventListener('blur', () => {
    // Delay so click on suggestion can register first
    setTimeout(close, 120);
  });

  // Clicking outside closes the dropdown
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#ticker-suggest') && e.target !== inp) close();
  });
}

// Mobile-only: horizontal scroll-snap pager for the kanban columns.
// Renders one dot per column + the active column label, and keeps them
// in sync as the user swipes.
function setupKanbanPager() {
  const pager = document.getElementById('kanban-pager');
  const kanban = document.getElementById('kanban');
  if (!pager || !kanban) return;

  // Only build the pager on mobile widths; keep DOM empty on desktop
  // so the (min-width:821px){display:none} rule has nothing to render.
  const isMobile = window.matchMedia('(max-width: 820px)').matches;
  if (!isMobile) { pager.innerHTML = ''; return; }

  const cols = Array.from(kanban.querySelectorAll('.col'));
  if (!cols.length) { pager.innerHTML = ''; return; }

  pager.innerHTML = cols.map((_, i) =>
    `<span class="dot${i === 0 ? ' active' : ''}" data-idx="${i}" role="tab" aria-label="Stage ${i + 1}"></span>`
  ).join('') + `<span class="label" id="kanban-pager-label"></span>`;

  const dots = Array.from(pager.querySelectorAll('.dot'));
  const label = document.getElementById('kanban-pager-label');

  const setActive = (idx) => {
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    const ttl = cols[idx]?.querySelector('.col-h .ttl');
    if (label && ttl) label.textContent = (ttl.textContent || '').replace(/\s*auto\s*$/i, '').trim();
  };
  setActive(0);

  // Tap dot => scroll to column
  dots.forEach((d, i) => {
    d.addEventListener('click', () => {
      cols[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  });

  // Observe which column is currently centered
  if (kanban._pagerObserver) kanban._pagerObserver.disconnect();
  const io = new IntersectionObserver((entries) => {
    // Pick the entry with the largest intersection ratio
    let best = null;
    entries.forEach(e => {
      if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
    });
    if (best && best.isIntersecting) {
      const idx = cols.indexOf(best.target);
      if (idx >= 0) setActive(idx);
    }
  }, { root: kanban, threshold: [0.55, 0.75, 0.95] });
  cols.forEach(c => io.observe(c));
  kanban._pagerObserver = io;
}

// Re-run pager setup on resize (viewport crosses the mobile breakpoint).
let _kanbanResizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(_kanbanResizeT);
  _kanbanResizeT = setTimeout(setupKanbanPager, 150);
});

async function addCard() {
  const tk = document.getElementById('add-ticker').value.trim().toUpperCase();
  let nm = document.getElementById('add-name').value.trim();
  if (!tk) { alert('Ticker requerido'); return; }

  const btn = document.getElementById('add-btn');
  const originalLabel = btn ? btn.textContent : '+ Add';

  // Auto-resolve company name via Finnhub profile2 when the user left it
  // blank. Fall back to the ticker itself if the lookup fails so the
  // card always ends up with a non-empty name (DB requires it).
  if (!nm) {
    if (btn) { btn.textContent = '…'; btn.disabled = true; }
    try {
      const r = await fetch(`/api/finnhub-quote?profile=1&symbol=${encodeURIComponent(tk)}`);
      if (r.ok) {
        const p = await r.json();
        nm = (p && typeof p.name === 'string' && p.name.trim()) ? p.name.trim() : '';
      }
    } catch (_) { /* offline / rate-limited — fall through */ }
    if (!nm) nm = tk; // guaranteed non-empty fallback
    if (btn) { btn.textContent = originalLabel; btn.disabled = false; }
  }

  try {
    const resp = await api('/api/admin/pipeline-cards', {
      method: 'POST',
      body: JSON.stringify({ ticker: tk, name: nm, stage: 'backlog', note: null }),
    });
    const data = resp.item || resp;
    pipeline.unshift(data);
    document.getElementById('add-ticker').value = '';
    document.getElementById('add-name').value = '';
    if (prefill) dismissPrefill();
    renderBoard();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function deleteCard(id) {
  const c = pipeline.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Remove ${c.ticker} from the pipeline?`)) return;

  try {
    await api(`/api/admin/pipeline-cards?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
    pipeline = pipeline.filter(x => x.id !== id);
    delete commentsByCard[id];
    renderBoard();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// Terminal stages require a Decision Journal entry — the stage change is
// driven by journal-create, never by the kanban PATCH directly. See
// api/_pipeline-stage.js (onBuyDecision / onPassDecision / onFollowDecision).
const TERMINAL_STAGE_TO_JOURNAL = {
  invested: 'BUY',
  passed:   'PASS',
  followed: 'FOLLOW',
};

// Forward transitions that require specific research artifacts to be
// attached to the card before the move is allowed. Only Backlog → Deep
// Dive is gated for now; other transitions are free (and terminals have
// their own Decision Journal gate above).
//
// Assets are checked against pipeline_card_assets (active=true).
const ASSET_GATES = {
  // key = target stage; value = { fromStages, requiredKinds, label }
  analysis: {
    fromStages: ['backlog'],
    requiredKinds: ['excel', 'dashboard_json', 'company_brief_pdf'],
    label: 'Deep Dive',
    kindLabels: {
      excel: 'Columbia model (Excel)',
      dashboard_json: 'Columbia dashboard (JSON)',
      company_brief_pdf: 'Company Brief (PDF)',
    },
  },
  review: {
    fromStages: ['analysis'],
    requiredKinds: ['thesis_builder_pdf', 'thesis_breaker_pdf'],
    label: 'Adversarial',
    kindLabels: {
      thesis_builder_pdf: 'Thesis Builder (PDF)',
      thesis_breaker_pdf: 'Thesis Breaker (PDF)',
    },
  },
};

async function _fetchActiveAssetKinds(cardId) {
  try {
    const resp = await api(`/api/admin/pipeline-card-assets?card_id=${encodeURIComponent(cardId)}`);
    const items = Array.isArray(resp) ? resp : (resp.items || []);
    return new Set(items.filter(it => it.active !== false).map(it => it.kind));
  } catch (e) {
    console.warn('[moveCard] failed to fetch assets', e);
    return null; // signal: don't block on transient network error
  }
}

async function moveCard(id, newStage) {
  const c = pipeline.find(x => x.id === id);
  if (!c || c.stage === newStage) return;

  // Asset gate (forward-only): if target stage requires artifacts, check
  // they exist before allowing the move.
  const gate = ASSET_GATES[newStage];
  if (gate && gate.fromStages.includes(c.stage)) {
    const kinds = await _fetchActiveAssetKinds(id);
    if (kinds) { // null = network error, let it through rather than false-block
      const missing = gate.requiredKinds.filter(k => !kinds.has(k));
      if (missing.length) {
        const list = missing.map(k => `\u2022 ${gate.kindLabels[k] || k}`).join('\n');
        alert(
          `Cannot move ${c.ticker} to ${gate.label} yet.\n\n` +
          `Missing required artifacts:\n${list}\n\n` +
          `Upload them from the card detail (click the card) before advancing.`
        );
        return;
      }
    }
  }

  // Hard gate: moving into a terminal stage opens the Decision Journal in
  // the matching mode. The stage transition happens server-side only when
  // the journal entry is successfully created. If the user cancels, the
  // card stays where it was.
  const journalType = TERMINAL_STAGE_TO_JOURNAL[newStage];
  if (journalType) {
    const params = new URLSearchParams({
      action: 'new',
      ticker: c.ticker,
      type: journalType,
      return: 'research',
    });
    // Full navigation (not popup) — the kanban re-loads pipeline on
    // return, so the card will be in its new terminal column iff the
    // journal entry was actually created.
    window.location.href = `/journal.html?${params.toString()}`;
    return;
  }

  const moved_at = new Date().toISOString();
  try {
    const resp = await api(`/api/admin/pipeline-cards?id=${encodeURIComponent(id)}`, {
      method: 'PATCH',
      body: JSON.stringify({ stage: newStage, moved_at }),
    });
    const data = resp.item || resp;
    c.stage    = data.stage    || newStage;
    c.moved_at = data.moved_at || moved_at;
    renderBoard();
  } catch (e) {
    // Backend asset-gate returns 409 with structured payload — surface
    // the human message instead of the generic code.
    if (e.payload && e.payload.error === 'assets_required') {
      const missing = (e.payload.missing || []).map(k => {
        return ({
          dashboard_json: 'Columbia dashboard (JSON)',
          company_brief_pdf: 'Company Brief (PDF)',
          thesis_builder_pdf: 'Thesis Builder (PDF)',
          thesis_breaker_pdf: 'Thesis Breaker (PDF)',
          munger_digital_pdf: 'Munger Digital (PDF)',
          excel: 'Columbia model (Excel)',
        })[k] || k;
      });
      alert(
        `${e.payload.message}\n\n` +
        `Missing:\n\u2022 ${missing.join('\n\u2022 ')}\n\n` +
        `Upload from the card detail before advancing.`
      );
    } else {
      alert('Error: ' + e.message);
    }
    // Revert visual state by reloading
    await loadPipeline(); renderBoard();
  }
}

// ============================================================
function dragStart(e, id) {
  dragId = id;
  e.currentTarget.classList.add('dragging');
}
function dragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.col-body.drag-over').forEach(el => el.classList.remove('drag-over'));
}
function dragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function dragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function drop(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragId) moveCard(dragId, stage);
  dragId = null;
}

}
function closeModal() {
  openCardId = null;
  document.getElementById('modal-bg').classList.remove('show');
}

function renderModal() {
  const c = pipeline.find(x => x.id === openCardId);
  if (!c) { closeModal(); return; }
  const comments = commentsByCard[c.id] || [];

  // Q/V/IRR badges hidden per user preference (see cardHTML above).
  const badges = [];

  document.getElementById('modal').innerHTML = `
    <div class="modal-h">
      <div>
        <div class="tkr">${esc(c.ticker)}</div>
        <div class="nm">${esc(c.name)} · <span style="color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;font-size:10px;font-weight:600">${stageLabel(c.stage)}</span></div>
        ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="modal-section">
      <h4>Owner</h4>
      <div class="owner-picker" id="owner-picker">
        ${renderOwnerPicker(c)}
      </div>
    </div>

    <div class="modal-section">
      <h4>Note</h4>
      <textarea class="note-edit" id="note-edit">${esc(c.note || '')}</textarea>
      <button class="save-note" id="save-note-btn" onclick="saveNote()">Save note</button>
    </div>

    <div class="modal-section" id="deliverables-section">
      <h4>Deliverables</h4>
      <div class="deliverables" id="deliverables-list">
        <div style="font-size:11px;color:var(--gray-mid)">Loading…</div>
      </div>
      <div id="generate-dashboard-wrap" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)">
        <button id="generate-dashboard-btn" class="gen-btn" disabled onclick="publishDashboard()">Publish Dashboard</button>
        <div id="generate-dashboard-status" style="font-size:11px;color:var(--gray-mid);margin-top:6px"></div>
      </div>
    </div>

    <div class="modal-section">
      <h4>Comments (${comments.length})</h4>
      <div class="comments-list" id="comments-list">
        ${comments.length === 0
          ? `<div class="no-comments">No comments yet. Be the first.</div>`
          : comments.map(commentHTML).join('')}
      </div>
      <div class="comment-form">
        <textarea id="new-comment" placeholder="Write a comment…"></textarea>
        <button onclick="addComment()">Send</button>
      </div>
    </div>
  `;
}

function commentHTML(c) {
  const canDelete = (c.author_username || '').toLowerCase() === (currentUser.username || '').toLowerCase();
  const initials  = String(c.author_name || c.author_username || '?').trim().split(/\s+/).map(s => s[0]).slice(0,2).join('').toUpperCase();
  return `
    <div class="comment">
      <div class="avatar-circle">${esc(initials)}</div>
      <div class="comment-body">
        <div class="comment-h">
          <span class="auth">${esc(c.author_name || c.author_username)}</span>
          <span class="when">${fmtDateTime(c.created_at)}</span>
        </div>
        <div class="comment-text">${esc(c.body)}</div>
        ${canDelete ? `<button class="comment-del" onclick="deleteComment('${c.id}')">Delete</button>` : ''}
      </div>
    </div>
  `;
}

async function saveNote() {
  const newNote = document.getElementById('note-edit').value.trim();
  const c = pipeline.find(x => x.id === openCardId);
  if (!c) return;

  try {
    const resp = await api(`/api/admin/pipeline-cards?id=${encodeURIComponent(c.id)}`, {
      method: 'PATCH',
      body: JSON.stringify({ note: newNote || null }),
    });
    const data = resp.item || resp;
    c.note = (data && data.note !== undefined) ? data.note : (newNote || null);

    const btn = document.getElementById('save-note-btn');
    btn.textContent = '✓ Saved';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = 'Save note'; btn.classList.remove('saved'); }, 1500);
    renderBoard();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function addComment() {
  const ta = document.getElementById('new-comment');
  const body = ta.value.trim();
  if (!body) return;

  try {
    const resp = await api('/api/admin/pipeline-comments', {
      method: 'POST',
      body: JSON.stringify({ card_id: openCardId, body }),
    });
    const data = resp.item || resp;
    if (!commentsByCard[openCardId]) commentsByCard[openCardId] = [];
    commentsByCard[openCardId].push(data);
    ta.value = '';
    renderModal();
    renderBoard();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function deleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await api(`/api/admin/pipeline-comments?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
    commentsByCard[openCardId] = (commentsByCard[openCardId] || []).filter(c => c.id !== id);
    renderModal();
    renderBoard();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// ============================================================
// HELPERS
// ============================================================
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toISOString().slice(0, 10);
}
function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-CA') + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function stageLabel(id) {
  return (COLUMNS.find(c => c.id === id) || {}).title || id;
}

// ============================================================
// OWNER PICKER
// ============================================================
function renderOwnerPicker(c) {
  const selectedId = c.owner_id || null;
  const chips = [];
  // "Unassigned" chip
  const isUnass = !selectedId;
  chips.push(`
    <button class="owner-chip unassigned ${isUnass ? 'selected' : ''}" onclick="assignOwner(null)">
      <span class="av">–</span>
      <span>Unassigned</span>
    </button>
  `);
  // One chip per active analyst
  analysts.forEach(a => {
    const sel = (a.id === selectedId) ? 'selected' : '';
    chips.push(`
      <button class="owner-chip ${sel}" onclick="assignOwner('${esc(a.id)}')">
        <span class="av" style="background:${esc(a.color)}">${esc(a.initials)}</span>
        <span>${esc(a.name)}</span>
      </button>
    `);
  });
  return chips.join('');
}

async function assignOwner(ownerId) {
  const c = pipeline.find(x => x.id === openCardId);
  if (!c) return;
  const prev = c.owner_id || null;
  if (prev === (ownerId || null)) return;
  // Optimistic update
  c.owner_id = ownerId || null;
  const picker = document.getElementById('owner-picker');
  if (picker) picker.innerHTML = renderOwnerPicker(c);
  renderBoard();
  try {
    const resp = await api(`/api/admin/pipeline-cards?id=${encodeURIComponent(c.id)}`, {
      method: 'PATCH',
      body: JSON.stringify({ owner_id: ownerId || null }),
    });
    const item = resp.item || resp;
    if (item && item.owner_id !== undefined) c.owner_id = item.owner_id;
  } catch (e) {
    alert('Error: ' + e.message);
    c.owner_id = prev;
    if (picker) picker.innerHTML = renderOwnerPicker(c);
    renderBoard();
  }
}

// ============================================================
// DELIVERABLES — upload/replace/delete files per card
// ============================================================
function assetsBadgeHTML(cardId) {
  const items = deliverablesByCard[cardId] || [];
  if (!items.length) {
    return `<span class="card-assets pending" title="No deliverables uploaded">○○○○○○</span>`;
  }
  const have = new Set(items.map(it => it.kind));
  const order = ['excel','company_brief_pdf','thesis_builder_pdf','thesis_breaker_pdf','munger_digital_pdf','dashboard_json'];
  const dots = order.map(k => have.has(k) ? '●' : '○').join('');
  const total = order.length;
  const pending = order.filter(k => !have.has(k)).length;
  const cls = pending === 0 ? 'card-assets' : (pending === total ? 'card-assets pending' : 'card-assets');
  return `<span class="${cls}" title="${total-pending}/${total} deliverables uploaded">${dots}</span>`;
}

async function preloadAllDeliverables() {
  if (!pipeline || !pipeline.length) return;
  try {
    const token = localStorage.getItem('dce_admin_token');
    // Batch: fetch active assets grouped by card via one call
    const resp = await fetch('/api/admin/pipeline-card-assets-all', {
      headers: { 'x-admin-token': token || '' }
    });
    if (resp.ok) {
      const j = await resp.json();
      const grouped = {};
      (j.items || []).forEach(it => {
        if (!grouped[it.card_id]) grouped[it.card_id] = [];
        grouped[it.card_id].push(it);
      });
      deliverablesByCard = grouped;
      renderBoard();
    }
  } catch (_) { /* silent — endpoint may not exist yet; badges will populate on modal open */ }
}

const SLOT_CONFIG = [
  { kind: 'excel',              label: 'Excel model',      icon: 'XLSX',  accept: '.xlsx,.xls' },
  { kind: 'company_brief_pdf',  label: 'Company Brief',    icon: 'PDF',   accept: '.pdf' },
  { kind: 'thesis_builder_pdf', label: 'Thesis Builder',   icon: 'PDF',   accept: '.pdf' },
  { kind: 'thesis_breaker_pdf', label: 'Thesis Breaker',   icon: 'PDF',   accept: '.pdf' },
  { kind: 'munger_digital_pdf', label: 'Munger Digital',   icon: 'PDF',   accept: '.pdf' },
  { kind: 'dashboard_json',     label: 'Dashboard JSON',   icon: 'JSON',  accept: '.json' },
];

function fmtBytes(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}

async function loadDeliverables(cardId) {
  const listEl = document.getElementById('deliverables-list');
  if (!listEl) return;
  try {
    const resp = await api(`/api/admin/pipeline-card-assets?card_id=${encodeURIComponent(cardId)}`);
    const items = (resp && resp.items) || [];
    deliverablesByCard[cardId] = items;
    renderDeliverables(cardId);
    // Update card badge in the pipeline board
    renderBoard();
  } catch (e) {
    listEl.innerHTML = `<div style="font-size:11px;color:var(--red)">Failed to load: ${esc(e.message || e)}</div>`;
  }
}

function renderDeliverables(cardId) {
  const listEl = document.getElementById('deliverables-list');
  if (!listEl || openCardId !== cardId) return;
  const items = deliverablesByCard[cardId] || [];
  const byKind = {};
  items.forEach(it => { byKind[it.kind] = it; });

  listEl.innerHTML = SLOT_CONFIG.map(slot => {
    const it = byKind[slot.kind];
    const meta = it
      ? `<div class="slot-meta" title="${esc(it.filename)}">${esc(it.filename)} · ${fmtBytes(it.size_bytes)}</div>`
      : `<div class="slot-meta empty">— not uploaded —</div>`;
    const publishedBtn = (it && slot.kind === 'dashboard_json')
      ? `<button class="slot-btn" onclick="openPublishedDashboard()">View Published</button>`
      : '';
    const actions = it
      ? `${publishedBtn}<a class="slot-btn" href="${esc(it.signed_url || '#')}" target="_blank" rel="noopener">Open</a>
         <button class="slot-btn" onclick="pickSlotFile('${slot.kind}')">Replace</button>
         <button class="slot-btn danger" onclick="deleteSlot(${it.id})">Remove</button>`
      : `<button class="slot-btn" onclick="pickSlotFile('${slot.kind}')">Upload</button>`;
    return `
      <div class="slot" data-kind="${slot.kind}">
        <div class="slot-icon">${slot.icon}</div>
        <div class="slot-body">
          <div class="slot-label">${slot.label}</div>
          ${meta}
        </div>
        <div class="slot-actions">${actions}</div>
        <input type="file" id="slot-input-${slot.kind}" accept="${slot.accept}" onchange="uploadSlotFile('${slot.kind}', this.files[0]); this.value='';">
      </div>
    `;
  }).join('');

  updateGenerateButton(cardId);
}

function updateGenerateButton(cardId) {
  const btn = document.getElementById('generate-dashboard-btn');
  const status = document.getElementById('generate-dashboard-status');
  if (!btn) return;
  const items = deliverablesByCard[cardId] || [];
  const kinds = new Set(items.map(it => it.kind));
  const hasJson  = kinds.has('dashboard_json');
  btn.disabled = !hasJson;
  btn.textContent = 'Publish Dashboard';
  if (status) {
    if (!hasJson) {
      status.textContent = 'Upload the Dashboard JSON generated by the columbia-dashboard-converter skill to enable publishing.';
    } else {
      status.textContent = 'Ready — will publish to /company.html and replace any prior version.';
    }
  }
}

function openPublishedDashboard() {
  if (!openCardId) return;
  const c = pipeline.find(x => x.id === openCardId);
  if (!c || !c.ticker) { alert('No ticker on this card'); return; }
  window.open(`/company.html?ticker=${encodeURIComponent(c.ticker)}`, '_blank', 'noopener');
}

async function publishDashboard() {
  if (!openCardId) return;
  const btn = document.getElementById('generate-dashboard-btn');
  const status = document.getElementById('generate-dashboard-status');
  if (!btn || !status) return;
  const prior = btn.textContent;
  btn.classList.add('busy');
  btn.disabled = true;
  btn.textContent = 'Publishing…';
  status.textContent = 'Validating JSON and publishing to /company.html…';
  try {
    const token = localStorage.getItem('dce_admin_token');
    const r = await fetch(`/api/admin/pipeline-card-publish-dashboard?card_id=${encodeURIComponent(openCardId)}`, {
      method: 'POST',
      headers: { 'x-admin-token': token || '' },
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || j.detail || `HTTP ${r.status}`);
    status.textContent = `✓ Published → ${j.url}`;
    await loadDeliverables(openCardId);
  } catch (e) {
    status.textContent = `✗ Failed: ${e.message || e}`;
    btn.textContent = prior;
  } finally {
    btn.classList.remove('busy');
  }
}

function pickSlotFile(kind) {
  const inp = document.getElementById(`slot-input-${kind}`);
  if (inp) inp.click();
}

async function uploadSlotFile(kind, file) {
  if (!file || !openCardId) return;
  if (file.size > 25 * 1024 * 1024) {
    alert('File too large (max 25 MB)');
    return;
  }
  const slotEl = document.querySelector(`.slot[data-kind="${kind}"] .slot-actions`);
  const priorHTML = slotEl ? slotEl.innerHTML : '';
  if (slotEl) slotEl.innerHTML = `<button class="slot-btn uploading">Uploading…</button>`;

  const url = `/api/admin/pipeline-card-upload?card_id=${encodeURIComponent(openCardId)}&kind=${encodeURIComponent(kind)}&filename=${encodeURIComponent(file.name)}`;
  try {
    const token = localStorage.getItem('dce_admin_token');
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'x-admin-token': token || '', 'Content-Type': 'application/octet-stream' },
      body: file,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    // Refresh list
    await loadDeliverables(openCardId);
  } catch (e) {
    if (slotEl) slotEl.innerHTML = priorHTML;
    alert('Upload failed: ' + (e.message || e));
  }
}

async function deleteSlot(id) {
  if (!confirm('Remove this file?')) return;
  try {
    const token = localStorage.getItem('dce_admin_token');
    const r = await fetch(`/api/admin/pipeline-card-assets?id=${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { 'x-admin-token': token || '' },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    await loadDeliverables(openCardId);
  } catch (e) {
    alert('Delete failed: ' + (e.message || e));
  }
}

// ============================================================
// LIFT-OFF
// ============================================================
boot();
</script>
<script src="/search.js" defer></script>
