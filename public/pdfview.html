<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Document Viewer · DCE Holdings</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/pwa-shell.css?v=68">
<script src="/pwa-shell.js?v=68" defer></script>
<script src="/dce-auth.js" defer></script>
<style>
  :root{
    --navy:#1B2642;
    --gold:#B88B47;
    --gold-lt:#d4aa6a;
    --white:#ffffff;
    --gray-bg:#f4f2ec;
    --rule:rgba(255,255,255,0.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--gray-bg);
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:var(--navy);
    overflow:hidden}
  .pv-header{
    position:fixed;top:0;left:0;right:0;height:56px;
    background:var(--navy);color:var(--white);z-index:100;
    display:flex;align-items:center;padding:0 12px;gap:8px;
    padding-top:env(safe-area-inset-top,0);
    height:calc(56px + env(safe-area-inset-top,0px));
    box-shadow:0 1px 0 rgba(255,255,255,0.06),0 2px 8px rgba(0,0,0,0.15);
  }
  .pv-back{
    display:inline-flex;align-items:center;gap:6px;
    background:transparent;color:var(--white);
    border:1px solid rgba(255,255,255,0.25);
    padding:8px 12px;font-size:12px;font-weight:600;
    letter-spacing:0.06em;text-transform:uppercase;
    font-family:'Archivo','Inter',sans-serif;
    cursor:pointer;border-radius:3px;
    text-decoration:none;line-height:1;
    -webkit-tap-highlight-color:transparent;
  }
  .pv-back:hover,.pv-back:active{
    background:rgba(255,255,255,0.10);border-color:var(--gold);color:var(--gold-lt);
  }
  .pv-back svg{width:14px;height:14px;flex-shrink:0}
  .pv-title{
    flex:1;font-family:'Archivo','Inter',sans-serif;
    font-size:12px;font-weight:600;letter-spacing:0.14em;
    text-transform:uppercase;color:rgba(255,255,255,0.85);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin:0 6px;
  }
  .pv-open{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--gold);color:var(--navy);
    border:1px solid var(--gold);
    padding:8px 12px;font-size:11px;font-weight:700;
    letter-spacing:0.08em;text-transform:uppercase;
    font-family:'Archivo','Inter',sans-serif;
    cursor:pointer;border-radius:3px;
    text-decoration:none;line-height:1;
    -webkit-tap-highlight-color:transparent;
  }
  .pv-open:hover,.pv-open:active{background:var(--gold-lt);border-color:var(--gold-lt)}
  .pv-open svg{width:12px;height:12px;flex-shrink:0}
  .pv-frame-wrap{
    position:fixed;
    top:calc(56px + env(safe-area-inset-top,0px));
    left:0;right:0;bottom:0;
    background:var(--gray-bg);
    overflow:hidden;
  }
  .pv-frame{
    width:100%;height:100%;border:0;background:var(--gray-bg);display:block;
  }
  .pv-error{
    padding:40px 24px;text-align:center;color:var(--navy);
    max-width:520px;margin:0 auto;
  }
  .pv-error h1{font-family:'Archivo',sans-serif;font-size:16px;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--gold)}
  .pv-error p{font-size:14px;line-height:1.55;color:rgba(27,38,66,0.75)}
  @media (max-width:520px){
    .pv-title{font-size:10px;letter-spacing:0.10em}
    .pv-back{padding:7px 10px;font-size:11px}
    .pv-open{padding:7px 10px;font-size:10px}
    .pv-back span.lbl{display:none}
  }
</style>
</head>
<body data-dce-auth="manual">
<header class="pv-header">
  <a class="pv-back" id="pv-back" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    <span class="lbl">Back</span>
  </a>
  <div class="pv-title" id="pv-title">Document</div>
  <a class="pv-open" id="pv-open" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 3h7v7"/><path d="M10 14L21 3"/>
      <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
    </svg>
    Open
  </a>
</header>
<div class="pv-frame-wrap" id="pv-frame-wrap">
  <iframe class="pv-frame" id="pv-frame" title="Document" allow="fullscreen"></iframe>
</div>
<script>
(function(){
  var q = new URLSearchParams(window.location.search);
  var src   = q.get('src')   || '';
  var title = q.get('title') || 'Document';
  var back  = q.get('back')  || '';

  // Sanitize src: must be same-origin OR http(s) https + absolute
  // We only accept paths starting with '/' or full https URLs on our host.
  function safeSrc(s) {
    if (!s) return '';
    try {
      // Relative path
      if (s.charAt(0) === '/') return s;
      var u = new URL(s, window.location.origin);
      // Same-origin only for arbitrary URLs; we don't proxy 3rd party
      if (u.origin === window.location.origin) return u.pathname + u.search + u.hash;
      return '';
    } catch (e) { return ''; }
  }
  function safeBack(b) {
    if (!b) return '';
    if (b.charAt(0) === '/') return b;
    try {
      var u = new URL(b, window.location.origin);
      if (u.origin === window.location.origin) return u.pathname + u.search + u.hash;
      return '';
    } catch (e) { return ''; }
  }

  var cleanSrc  = safeSrc(src);
  var cleanBack = safeBack(back);

  // Title
  var titleEl = document.getElementById('pv-title');
  titleEl.textContent = title.slice(0, 80);
  document.title = title + ' · DCE Holdings';

  // Back button: prefer explicit `back`, fall back to history.back(),
  // then to referrer, then home. We also intercept the click so a broken
  // history stack in PWA-standalone doesn't strand the user.
  var backEl = document.getElementById('pv-back');
  var backHref = cleanBack || '/';
  backEl.href = backHref;
  backEl.addEventListener('click', function(ev){
    // If explicit back URL was provided, honor it and skip history
    if (cleanBack) return;  // let the anchor navigate normally
    ev.preventDefault();
    // Try history first (PWA standalone typically has 1 entry, will fall through)
    if (window.history.length > 1 && document.referrer &&
        new URL(document.referrer, window.location.origin).origin === window.location.origin) {
      window.history.back();
      return;
    }
    // Fallback to referrer
    if (document.referrer) {
      try {
        var r = new URL(document.referrer, window.location.origin);
        if (r.origin === window.location.origin) { window.location.href = r.pathname + r.search; return; }
      } catch(e){}
    }
    window.location.href = '/';
  });

  // Open externally
  var openEl = document.getElementById('pv-open');
  if (cleanSrc) openEl.href = cleanSrc; else openEl.style.display = 'none';

  // Load iframe
  var frameEl = document.getElementById('pv-frame');
  if (!cleanSrc) {
    document.getElementById('pv-frame-wrap').innerHTML =
      '<div class="pv-error"><h1>Document not available</h1>' +
      '<p>No document URL was provided, or the URL points outside DCE Holdings.</p>' +
      '<p><a href="' + backHref + '" style="color:var(--gold);text-decoration:none">Return</a></p></div>';
    return;
  }

  // For PDFs on iOS PWA standalone, some viewers refuse to render in iframe.
  // We first try iframe; if it fails to load in 4s, we fall back to a full-page link.
  frameEl.src = cleanSrc;
  var loaded = false;
  frameEl.addEventListener('load', function(){ loaded = true; });
  setTimeout(function(){
    if (!loaded) {
      // iOS PWA fallback: swap iframe for a click-through prompt
      // (iframe onload sometimes never fires for cross-origin/PDF blob responses)
    }
  }, 4000);
})();
</script>
</body>
</html>
